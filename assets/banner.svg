<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff3333"/>
      <stop offset="50%" style="stop-color:#ffcc00"/>
      <stop offset="100%" style="stop-color:#33ff33"/>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)" rx="10"/>

  <!-- Border -->
  <rect x="2" y="2" width="796" height="196" fill="none" stroke="url(#bannerGrad)" stroke-width="2" rx="10"/>

  <!-- Worm icon on left -->
  <g transform="translate(40, 50)">
    <!-- Worm body -->
    <ellipse cx="20" cy="50" rx="16" ry="14" fill="#ff3333" opacity="0.9"/>
    <ellipse cx="45" cy="45" rx="18" ry="16" fill="#ff6633" opacity="0.9"/>
    <ellipse cx="75" cy="42" rx="20" ry="18" fill="#ffaa00" opacity="0.9"/>
    <ellipse cx="105" cy="45" rx="18" ry="16" fill="#aaff00" opacity="0.9"/>
    <ellipse cx="130" cy="50" rx="16" ry="14" fill="#33ff33" opacity="0.9"/>

    <!-- Head -->
    <ellipse cx="152" cy="52" rx="14" ry="12" fill="#33ff66"/>
    <circle cx="158" cy="48" r="4" fill="#0a0a14"/>
    <circle cx="159" cy="47" r="1.5" fill="#fff"/>

    <!-- Antenna -->
    <path d="M 162 42 Q 172 28 168 18" stroke="#33ff66" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="168" cy="18" r="3" fill="#33ff66"/>
  </g>

  <!-- Main title -->
  <text x="220" y="95" fill="url(#bannerGrad)" font-family="monospace" font-weight="bold" font-size="64" filter="url(#textGlow)">WORM-AI</text>

  <!-- Subtitle -->
  <text x="220" y="130" fill="#888888" font-family="monospace" font-size="20">= Grok API CLI  Kali Linux Edition</text>

  <!-- Tagline -->
  <text x="220" y="160" fill="#555555" font-family="monospace" font-size="14">Lightweight " Powerful " Terminal-native</text>

  <!-- Decorative code on right -->
  <text x="680" y="60" fill="#33ff3344" font-family="monospace" font-size="10" text-anchor="end">01101000</text>
  <text x="700" y="80" fill="#33ff3333" font-family="monospace" font-size="10" text-anchor="end">10010110</text>
  <text x="720" y="100" fill="#33ff3322" font-family="monospace" font-size="10" text-anchor="end">01001010</text>
  <text x="690" y="140" fill="#33ff3322" font-family="monospace" font-size="10" text-anchor="end">11010101</text>
  <text x="710" y="160" fill="#33ff3311" font-family="monospace" font-size="10" text-anchor="end">00101110</text>
</svg>
